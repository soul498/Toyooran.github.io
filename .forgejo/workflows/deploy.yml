name: Deploy Toyooran

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/Toyooran
            git remote get-url forgejo >/dev/null 2>&1 || git remote add forgejo https://git.toyooran.com/mhzare/toyooran.git
            git fetch forgejo main || git fetch origin main
            git reset --hard forgejo/main || git reset --hard origin/main
            docker build -t toyooran .
            docker stop toyooran-app || true
            docker rm toyooran-app || true
            docker run -d \
              --name toyooran-app \
              -p 127.0.0.1:3000:3000 \
              --restart always \
              -e NODE_ENV=production \
              -e APP_URL=https://www.toyooran.com \
              --env-file /opt/Toyooran/.env \
              toyooran
