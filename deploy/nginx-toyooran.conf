server {

    server_name toyooran.com www.toyooran.com;

    # Do not send Connection: upgrade on every GET — it can interact badly with
    # ArvanCloud bot-challenge 307 loops for cookie-less crawlers.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
    }

    if ($host = toyooran.com) {
        return 301 https://www.toyooran.com$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/toyooran.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/toyooran.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.toyooran.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = toyooran.com) {
        return 301 https://www.toyooran.com$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name toyooran.com www.toyooran.com;
    return 404; # managed by Certbot
}
